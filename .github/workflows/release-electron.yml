name: Release Electron

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a new version or retry an existing release tag
        required: true
        type: choice
        options:
          - new-release
          - retry
        default: new-release
      bump:
        description: Version increment for a new release; ignored when operation is retry
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      retry_tag:
        description: Existing vX.Y.Z tag to retry; required when operation is retry
        required: false
        type: string
      targets:
        description: Which installers to build; ubuntu skips the signed macOS build
        required: true
        type: choice
        options:
          - both
          - macos
          - ubuntu
        default: both

permissions:
  contents: read

concurrency:
  group: electron-release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.source.outputs.tested_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.operation == 'retry' && inputs.retry_tag || 'main' }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0
          cache: npm

      - name: Validate release operation
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          BUMP_LEVEL: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs.retry_tag }}
          WORKFLOW_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"

          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          fi

          case "$RELEASE_OPERATION" in
            new-release)
              case "$BUMP_LEVEL" in
                patch|minor|major) ;;
                *)
                  echo "Unsupported version bump: $BUMP_LEVEL" >&2
                  exit 1
                  ;;
              esac
              if [[ -n "$RETRY_TAG" ]]; then
                echo "retry_tag must be empty for a new release." >&2
                exit 1
              fi
              ;;
            retry)
              if [[ ! "$RETRY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "retry_tag must match vX.Y.Z." >&2
                exit 1
              fi
              if ! git ls-remote --exit-code --tags origin "refs/tags/$RETRY_TAG" >/dev/null 2>&1; then
                echo "Remote tag does not exist: $RETRY_TAG" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "Retry tag must point to a commit reachable from origin/main." >&2
                exit 1
              fi

              package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
              tag_version="${RETRY_TAG#v}"
              if [[ "$package_version" != "$tag_version" ]]; then
                echo "package.json version $package_version does not match $RETRY_TAG." >&2
                exit 1
              fi

              if release_draft="$(gh release view "$RETRY_TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
                if [[ "$release_draft" != "true" ]]; then
                  echo "Release is already published and cannot be retried: $RETRY_TAG" >&2
                  exit 1
                fi
              fi
              ;;
            *)
              echo "Unsupported release operation: $RELEASE_OPERATION" >&2
              exit 1
              ;;
          esac

      - name: Check package lock
        run: npm run check:package-lock

      # onnxruntime-node's install script downloads its native binary, and a
      # transient download-host timeout fails the whole install (seen in CI).
      # npm ci starts from an empty node_modules each time, so a retry is safe.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "npm ci failed; retrying in 15s (attempt $attempt of 3)." >&2
              sleep 15
            fi
          done
          exit 1

      - name: Check pinned GitHub Actions
        run: npm run check:actions-pinned

      - name: Validate Welcome assets
        run: npm run check:welcome-assets

      # Electron 43 downloads its binary on the first require("electron"); fetch
      # it here, with retries, as pr-tests.yml does, before the tests and probes.
      - name: Install Electron
        run: |
          for attempt in 1 2 3; do
            if npx --no install-electron; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Electron download failed; retrying in 15s (attempt $attempt of 3)." >&2
              sleep 15
            fi
          done
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install Electron Secret Service dependencies
        run: sudo apt-get install --yes gnome-keyring dbus-x11 libsecret-1-0

      - name: Run tests
        run: dbus-run-session -- xvfb-run --auto-servernum bash scripts/run-linux-ci-tests.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Check Electron runtime
        run: node electron/runtime.check.cjs

      - name: Run Electron runtime probes
        run: |
          npm run desktop:runtime-probe
          npm run desktop:strip-types-probe

      - name: Record tested source
        id: source
        run: echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The version commit, tag and Draft Release are made once, here, so every installer builds the same tag.
  version:
    name: Choose the version and create the Draft Release
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      RELEASE_OPERATION: ${{ inputs.operation }}
      BUMP_LEVEL: ${{ inputs.bump }}
      RETRY_TAG: ${{ inputs.retry_tag }}
      TESTED_SHA: ${{ needs.preflight.outputs.tested_sha }}
    steps:
      - name: Checkout tested release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.tested_sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0
          cache: npm

      - name: Validate source has not changed
        run: |
          set -euo pipefail
          git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"

          if [[ "$RELEASE_OPERATION" == "new-release" ]]; then
            remote_main="$(git rev-parse origin/main)"
            if [[ "$remote_main" != "$TESTED_SHA" ]]; then
              echo "main changed after preflight; run the release again." >&2
              exit 1
            fi
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/$RETRY_TAG" >/dev/null 2>&1; then
              echo "Remote tag no longer exists: $RETRY_TAG" >&2
              exit 1
            fi
            tag_sha="$(git rev-list -n 1 "$RETRY_TAG")"
            if [[ "$tag_sha" != "$TESTED_SHA" ]]; then
              echo "The retry tag changed after preflight: $RETRY_TAG" >&2
              exit 1
            fi
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Release checkout is not clean." >&2
            exit 1
          fi

      - name: Create new version or select retry tag
        id: version
        run: |
          set -euo pipefail

          if [[ "$RELEASE_OPERATION" == "new-release" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version "$BUMP_LEVEL"
            RELEASE_TAG="$(git describe --tags --exact-match HEAD)"

            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi

            git push origin HEAD:main --follow-tags
          else
            RELEASE_TAG="$RETRY_TAG"
            package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            if [[ "$package_version" != "${RELEASE_TAG#v}" ]]; then
              echo "package.json version does not match $RELEASE_TAG." >&2
              exit 1
            fi
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create or reuse Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_draft="$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [[ "$release_draft" != "true" ]]; then
              echo "Release is already published and cannot be changed: $RELEASE_TAG" >&2
              exit 1
            fi
            echo "Reusing existing Draft Release $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "OctopusBeak $RELEASE_TAG" \
              --verify-tag
          fi

  release:
    name: Build macOS arm64 into the Draft Release
    needs: [preflight, version]
    if: ${{ inputs.targets != 'ubuntu' }}
    runs-on: macos-15
    environment:
      name: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      OCTOPUSBEAK_NOTARY_PROFILE: OctopusBeakNotary
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.version.outputs.release_tag }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0
          cache: npm

      # onnxruntime-node's install script downloads its native binary, and a
      # transient download-host timeout fails the whole install (seen in CI).
      # npm ci starts from an empty node_modules each time, so a retry is safe.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "npm ci failed; retrying in 15s (attempt $attempt of 3)." >&2
              sleep 15
            fi
          done
          exit 1


      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OCTOPUSBEAK_USAGE_PING_URL: ${{ secrets.OCTOPUSBEAK_USAGE_PING_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MACOS_CERTIFICATE_BASE64" ]] || missing+=(MACOS_CERTIFICATE_BASE64)
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "$APPLE_ID" ]] || missing+=(APPLE_ID)
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          # ADR 0078: a release without the usage endpoint would silently never ask or send.
          [[ -n "$OCTOPUSBEAK_USAGE_PING_URL" ]] || missing+=(OCTOPUSBEAK_USAGE_PING_URL)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi


      - name: Configure signing keychain
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/octopusbeak-signing.keychain-db"
          KEYCHAIN_PASSWORD="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "OCTOPUSBEAK_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$OCTOPUSBEAK_NOTARY_PROFILE" \
            --keychain "$OCTOPUSBEAK_NOTARY_KEYCHAIN" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed and notarized app
        env:
          OCTOPUSBEAK_USAGE_PING_URL: ${{ secrets.OCTOPUSBEAK_USAGE_PING_URL }}
        run: |
          set -euo pipefail

          detach_stale_volumes() {
            local volume
            for volume in /Volumes/OctopusBeak*; do
              [[ -e "$volume" ]] || continue
              hdiutil detach "$volume" -force || true
            done
          }

          if npm run desktop:make:signed; then
            exit 0
          fi

          # The signed, notarized app is already packaged when the DMG maker
          # trips over hdiutil, so retry only the make step.
          for attempt in 2 3; do
            if [[ -z "$(find out -maxdepth 2 -type d -name '*.app' -print -quit)" ]]; then
              echo "Make failed before an app bundle was packaged; not retrying." >&2
              exit 1
            fi
            echo "Make failed; retrying distributables (attempt $attempt of 3)." >&2
            detach_stale_volumes
            rm -rf out/make
            sleep 15
            if OCTOPUSBEAK_SIGN=1 npx electron-forge make --skip-package; then
              exit 0
            fi
          done
          exit 1

      - name: Verify packaged fuses
        run: node scripts/check-packaged-fuses.mjs --app out/OctopusBeak-darwin-arm64/OctopusBeak.app

      - name: Verify signed app
        run: |
          set -euo pipefail
          APP_PATH="$(find out -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No app bundle found." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          # stapler validate looks the ticket up on Apple's CloudKit, which
          # occasionally drops the connection.
          for attempt in 1 2 3; do
            if xcrun stapler validate "$APP_PATH"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "stapler validate failed; retrying in 15s (attempt $attempt of 3)." >&2
              sleep 15
            fi
          done
          exit 1

      - name: Verify packaged assets and automation worker
        timeout-minutes: 10
        run: |
          set -euo pipefail
          APP_PATH="out/OctopusBeak-darwin-arm64/OctopusBeak.app"
          node scripts/check-packaged-assets.mjs --app-root "$APP_PATH/Contents/Resources/app"
          npm run desktop:packaged-browser-smoke -- --app-root "$APP_PATH" --recognition

      - name: Collect installer artifacts
        run: |
          set -euo pipefail
          assets=()
          has_dmg=0
          has_zip=0
          while IFS= read -r asset; do
            assets+=("$asset")
            case "$asset" in
              *.dmg) has_dmg=1 ;;
              *.zip) has_zip=1 ;;
            esac
          done < <(find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) | sort)

          if (( ${#assets[@]} == 0 || has_dmg == 0 || has_zip == 0 )); then
            echo "Expected both DMG and ZIP installer artifacts." >&2
            exit 1
          fi

          printf '%s\n' "${assets[@]}"

          # The website links to releases/latest/download/OctopusBeak-arm64.dmg, so every release carries
          # an unversioned copy of its DMG beside the versioned one.
          shopt -s nullglob
          dmgs=(out/make/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one DMG in out/make, found ${#dmgs[@]}." >&2
            exit 1
          fi
          cp "${dmgs[0]}" out/make/OctopusBeak-arm64.dmg

          # Installed Apps read this from releases/latest (ADR 0083); it fails when the ZIP it names is missing.
          node scripts/update-feed.mjs out/make

          (
            cd out/make
            find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'update-feed-darwin-arm64.json' \) -print | sort | while IFS= read -r asset; do
              shasum -a 256 "$asset"
            done
          ) > SHA256SUMS.txt


      - name: Upload installers, update feed and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) | sort)
          gh release upload "$RELEASE_TAG" "${assets[@]}" out/make/update-feed-darwin-arm64.json SHA256SUMS.txt --clobber

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${OCTOPUSBEAK_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OCTOPUSBEAK_NOTARY_KEYCHAIN" || true
          fi

  # ADR 0141: the Ubuntu package and its signed apt repository. It runs after the macOS job because that job
  # creates the version commit and tag this one builds.
  linux:
    name: Build and sign Ubuntu amd64
    needs: [version, release]
    if: ${{ always() && inputs.targets != 'macos' && needs.version.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.version.outputs.release_tag }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "npm ci failed; retrying in 15s (attempt $attempt of 3)." >&2
              sleep 15
            fi
          done
          exit 1

      - name: Validate Ubuntu release secrets
        env:
          APT_SIGNING_SUBKEY: ${{ secrets.APT_SIGNING_SUBKEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_SUBKEY_FPR: ${{ vars.APT_SIGNING_SUBKEY_FPR }}
          OCTOPUSBEAK_USAGE_PING_URL: ${{ secrets.OCTOPUSBEAK_USAGE_PING_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APT_SIGNING_SUBKEY" ]] || missing+=(APT_SIGNING_SUBKEY)
          [[ -n "$APT_SIGNING_PASSPHRASE" ]] || missing+=(APT_SIGNING_PASSPHRASE)
          [[ -n "$APT_SIGNING_SUBKEY_FPR" ]] || missing+=(APT_SIGNING_SUBKEY_FPR)
          # ADR 0078: a release without the usage endpoint would silently never ask or send.
          [[ -n "$OCTOPUSBEAK_USAGE_PING_URL" ]] || missing+=(OCTOPUSBEAK_USAGE_PING_URL)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release secrets or variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install packaging tools
        run: sudo apt-get install --yes dpkg-dev fakeroot

      - name: Build the .deb
        env:
          OCTOPUSBEAK_USAGE_PING_URL: ${{ secrets.OCTOPUSBEAK_USAGE_PING_URL }}
        run: npm run desktop:make

      - name: Collect the .deb and update feed
        run: |
          set -euo pipefail
          debs=(out/make/deb/x64/*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "Expected exactly one .deb, found ${#debs[@]}." >&2
            exit 1
          fi
          expected="octopusbeak_${RELEASE_TAG#v}_amd64.deb"
          if [[ "$(basename "${debs[0]}")" != "$expected" ]]; then
            echo "Expected $expected, found $(basename "${debs[0]}")." >&2
            exit 1
          fi
          mkdir -p dist
          cp "${debs[0]}" "dist/$expected"
          # Installed Ubuntu Apps read this from releases/latest and only announce it (ADR 0141).
          node scripts/update-feed.mjs dist linux-x64

      - name: Build and sign the apt repository
        env:
          APT_SIGNING_SUBKEY: ${{ secrets.APT_SIGNING_SUBKEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_SUBKEY_FPR: ${{ vars.APT_SIGNING_SUBKEY_FPR }}
        run: |
          set -euo pipefail
          # A short path: gpg-agent's socket path has a length limit.
          export GNUPGHOME="$(mktemp -d /tmp/ob-sign.XXXXXX)"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT

          gpg --batch --import <<< "$APT_SIGNING_SUBKEY"
          node --input-type=module -e '
            import { buildAptRepository } from "./scripts/apt-repo.mjs";
            import { readdirSync } from "node:fs";
            const debs = readdirSync("dist").filter((name) => name.endsWith(".deb")).map((name) => `dist/${name}`);
            buildAptRepository({
              debs,
              outDir: "apt-repo",
              gnupgHome: process.env.GNUPGHOME,
              signingKey: process.env.APT_SIGNING_SUBKEY_FPR,
              passphrase: process.env.APT_SIGNING_PASSPHRASE,
            });
          '

          # The repository must verify against the keyring this release ships, or no user can update.
          gpgv --keyring "$PWD/packaging/deb/octopusbeak-archive-keyring.gpg" --output /dev/null apt-repo/dists/stable/InRelease
          gpgv --keyring "$PWD/packaging/deb/octopusbeak-archive-keyring.gpg" apt-repo/dists/stable/Release.gpg apt-repo/dists/stable/Release

          tar -C apt-repo -cf dist/apt-repo.tar .
          (cd dist && sha256sum ./*.deb ./apt-repo.tar ./update-feed-linux-x64.json) > dist/SHA256SUMS-linux.txt

      - name: Upload the .deb, apt repository, update feed and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.deb dist/apt-repo.tar dist/update-feed-linux-x64.json dist/SHA256SUMS-linux.txt --clobber

      - name: Keep the apt repository for the Pages deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-repo
          path: apt-repo
          if-no-files-found: error
          retention-days: 1

  pages-deploy:
    name: Deploy the apt repository to Pages
    needs: [version, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.version.outputs.release_tag }}
          lfs: true

      - name: Download the signed apt repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-repo
          path: site/apt

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The Draft Release becomes public only after a clean Ubuntu sees the new version through apt.
  publish:
    name: Confirm apt, then publish the Release
    needs: [version, release, linux, pages-deploy]
    if: ${{ always() && needs.version.result == 'success' && needs.release.result != 'failure' && needs.release.result != 'cancelled' && needs.linux.result != 'failure' && needs.linux.result != 'cancelled' && needs.pages-deploy.result != 'failure' && needs.pages-deploy.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.version.outputs.release_tag }}

      - name: Confirm apt sees the new version on Ubuntu 24.04
        if: ${{ inputs.targets != 'macos' }}
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          # The source file the .deb installs, pointed at the keyring in this checkout, and nothing else.
          sources="$(mktemp -d)"
          sed "s|^Signed-By: .*|Signed-By: $PWD/packaging/deb/octopusbeak-archive-keyring.gpg|" \
            packaging/deb/octopusbeak.sources > "$sources/octopusbeak.sources"
          only=(-o "Dir::Etc::sourceparts=$sources" -o "Dir::Etc::sourcelist=/dev/null")
          # Pages can take a few minutes to serve what was just deployed.
          for attempt in $(seq 1 20); do
            sudo apt-get "${only[@]}" update >/dev/null 2>&1 || true
            got="$(apt-cache "${only[@]}" policy octopusbeak | sed -n 's/^  Candidate: //p')"
            echo "attempt $attempt: apt sees '${got:-nothing}', want '$want'"
            if [[ "$got" == "$want" ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "apt never saw $want; the Draft Release stays unpublished." >&2
          exit 1

      # Ubuntu 26.04 changed how apt verifies signatures; report it without blocking the release.
      - name: Check apt on Ubuntu 26.04
        if: ${{ inputs.targets != 'macos' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          got="$(docker run --rm \
            -v "$PWD/packaging/deb/octopusbeak-archive-keyring.gpg:/usr/share/keyrings/octopusbeak-archive-keyring.gpg:ro" \
            -v "$PWD/packaging/deb/octopusbeak.sources:/tmp/octopusbeak.sources:ro" \
            ubuntu:26.04 bash -c '
              apt-get update >/dev/null && apt-get install --yes ca-certificates >/dev/null
              cp /tmp/octopusbeak.sources /etc/apt/sources.list.d/octopusbeak.sources
              apt-get update 2>&1 | tail -3 >&2
              apt-cache policy octopusbeak | sed -n "s/^  Candidate: //p"')"
          echo "apt on 26.04 sees: ${got:-nothing}"
          [[ "$got" == "$want" ]]

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          published="$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)"
          if [[ "$published" != "false" ]]; then
            echo "Release did not publish: $RELEASE_TAG" >&2
            exit 1
          fi
